[package]
name = "gf-data-1c"
description = "MCP-сервер к данным информационных баз 1С:Предприятие, только чтение"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Библиотека и бинарь из одного крейта: логика инструментов линкуется напрямую
# в приложение, которому MCP-обвязка не нужна, а бинарь остаётся сервером.
[lib]
name = "gf_data_1c"
path = "src/lib.rs"

[[bin]]
name = "gfdata"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
chrono.workspace = true
reqwest.workspace = true
ntlmclient.workspace = true

# DPAPI есть только в Windows; под другими платформами модуль secret собирается
# заглушкой, которая честно говорит, что защиты нет.
[target.'cfg(windows)'.dependencies]
windows.workspace = true
