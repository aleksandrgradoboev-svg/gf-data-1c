name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows — целевая платформа: там установщик расширения зовёт конфигуратор
        # и там работает защита паролей (DPAPI).
        # Linux — потому что сервер должен собираться и в контейнере.
        os: [windows-latest, ubuntu-latest]

    env:
      # Живые тесты ходят в стенды 1С по HTTP. На машине сборки стендов нет,
      # и молчать они обязаны сами — но флаг ставится явно, чтобы отсутствие
      # стенда не выглядело удачным прогоном по случайности.
      GT_SKIP_LIVE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Тулчейн Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Кэш
        uses: Swatinem/rust-cache@v2

      - name: Форматирование
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Сборка идёт из среза репозитория как он есть, без локальных артефактов.
      #
      # Расширение 1С кладётся в бинарь отдельным шагом сборки и в git не едет —
      # из-за этого свежий клон однажды перестал собираться вовсе (include_dir,
      # как и go:embed до него, требует существующий каталог). Второй раз то же
      # место уронило CI уже иначе: тест требовал артефакта, которого в чистом
      # клоне быть не может. Оба раза локально всё было зелёное.
      #
      # Поэтому проверяет машина на пустом дереве, а не память разработчика.
      - name: Сборка
        run: cargo build --workspace --all-targets

      - name: Тесты
        run: cargo test --workspace
