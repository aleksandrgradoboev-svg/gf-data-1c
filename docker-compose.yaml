# Запуск gf-data-1c в контейнере.
#
#   docker compose up -d --build      поднять MCP по HTTP
#   docker compose logs -f            посмотреть, что сказал сервер
#
# Настраивается переменными окружения (или файлом .env рядом):
#
#   BIND_HOST   на каком адресе хоста открыть   по умолчанию 127.0.0.1
#   PORT        порт хоста                      по умолчанию 9077
#   TOKEN       требовать Bearer-токен          по умолчанию пусто (проверки нет)
#   DATA_DIR    реестр баз и журнал сервера     по умолчанию ./data
#   KB_DB       база справки платформы (файл)   по умолчанию не подключается

services:
  gf-data-1c:
    build: .
    image: gf-data-1c:0.1.0
    container_name: gf-data-1c

    # Адрес 0.0.0.0 задан в CMD образа и здесь не повторяется: петля внутри
    # контейнера снаружи недостижима даже через опубликованный порт. Наружу
    # выносит строка ports, и там по умолчанию петля ХОСТА — то есть база
    # остаётся доступной только с этой машины, пока BIND_HOST не изменён.
    command: -http 0.0.0.0:9077 -token ${TOKEN:-}

    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-9077}:9077"

    volumes:
      # Реестр баз (в нём пароли) и журнал. Том нужен, иначе список баз
      # исчезает вместе с контейнером и регистрировать их придётся заново.
      #
      # ВАЖНО: пароли в реестре защищаются средствами Windows (DPAPI), а в
      # контейнере этого механизма нет — там они лежат открытым текстом в
      # файле с правами 0600. Каталог держите соответственно.
      - "${DATA_DIR:-./data}:/home/gfdata/.config/gt-data-1c"

      # База справки платформы — только чтение, сервер в неё не пишет.
      # Строка закомментирована: без справки работает всё, кроме инструмента
      # syntax, и он честно об этом говорит.
      # - "${KB_DB:-./kb/1c-platform-help.db}:/kb/1c-platform-help.db:ro"

    # environment:
    #   GTDATA_KB: /kb/1c-platform-help.db

    # Проверка живости спрашивает у сервера, а не стучится в порт: открытый порт
    # говорит лишь о том, что процесс жив, а нам нужно знать, что он ОТВЕЧАЕТ.
    # Через /dev/tcp самого bash — чтобы не тащить curl в образ ради одной строки.
    # Именно bash, а не CMD-SHELL: CMD-SHELL это /bin/sh, в Debian он dash,
    # а /dev/tcp — возможность bash и в dash не работает вовсе.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9077 &&
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q 'gf-data-1c' <&3
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    restart: unless-stopped

    # Сервер ходит только туда, куда ему сказали в реестре баз, и никаких особых
    # прав для этого не нужно.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
